<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>MICRO SHOW · O DESAFIO DA MICROBIOLOGIA</title>
  <style>
    /* ===== RESET & BASE ===== */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      min-height: 100vh;
      background: radial-gradient(circle at 20% 20%, #0b2b3b, #031016);
      font-family: 'Segoe UI', 'Poppins', 'Arial Black', system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px 12px 24px;
      color: white;
      position: relative;
      overflow-x: hidden;
    }

    /* ===== EFEITOS DE TV / AUDITÓRIO ===== */
    body::before {
      content: "";
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: radial-gradient(circle at 50% 30%, rgba(255, 215, 0, 0.08) 0%, transparent 60%),
                  repeating-linear-gradient(45deg, rgba(255,255,255,0.02) 0px, rgba(255,255,255,0.02) 2px, transparent 2px, transparent 8px);
      pointer-events: none;
      z-index: 0;
    }

    .stage-glow {
      position: fixed;
      top: -20vh;
      left: 50%;
      transform: translateX(-50%);
      width: 140vw;
      height: 60vh;
      background: radial-gradient(ellipse at 50% 0%, rgba(255, 200, 50, 0.25), transparent 70%);
      filter: blur(40px);
      pointer-events: none;
      z-index: 0;
    }

    .main-container {
      position: relative;
      z-index: 5;
      width: 100%;
      max-width: 1300px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    /* ===== CABEÇALHO MICRO SHOW ===== */
    .header {
      text-align: center;
      margin-bottom: 4px;
      position: relative;
      filter: drop-shadow(0 8px 12px rgba(0,0,0,0.7));
    }

    .header h1 {
      font-size: clamp(2.8rem, 12vw, 6.5rem);
      font-weight: 900;
      letter-spacing: 6px;
      text-transform: uppercase;
      background: linear-gradient(180deg, #fff8e0 0%, #ffd966 35%, #b8860b 75%, #f5e6a8 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      -webkit-text-stroke: 3px #0a1e2b;
      text-shadow: 0 0 20px #ffbb33, 0 0 45px #ffaa00, 0 10px 20px black;
      line-height: 1.1;
      white-space: nowrap;
    }

    .header .sub {
      font-size: clamp(0.9rem, 3vw, 1.8rem);
      font-weight: 700;
      letter-spacing: 8px;
      color: #dfeef7;
      text-shadow: 0 0 12px #3fa9f5, 0 3px 6px black;
      background: rgba(0, 30, 50, 0.6);
      display: inline-block;
      padding: 4px 30px;
      border-radius: 50px;
      backdrop-filter: blur(2px);
      border: 1px solid rgba(255, 215, 0, 0.6);
      margin-top: -6px;
      text-transform: uppercase;
    }

    /* ===== ROLETA ===== */
    .wheel-wrapper {
      position: relative;
      width: min(78vw, 78vh, 680px);
      aspect-ratio: 1/1;
      margin: 4px 0 6px;
      filter: drop-shadow(0 20px 30px rgba(0,0,0,0.8));
    }

    canvas#wheelCanvas {
      width: 100%;
      height: 100%;
      display: block;
      border-radius: 50%;
      background: #0d2c3a;
      box-shadow: inset 0 0 0 8px #1e4a5e, inset 0 0 30px #000000, 0 0 0 4px #c9a227, 0 0 50px #2a7faa;
    }

    /* ponteiro */
    .pointer {
      position: absolute;
      top: -12px;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border-left: 28px solid transparent;
      border-right: 28px solid transparent;
      border-top: 45px solid #f5d742;
      filter: drop-shadow(0 8px 8px black) drop-shadow(0 0 18px #ffd966);
      z-index: 30;
      pointer-events: none;
    }

    .pointer::after {
      content: "";
      position: absolute;
      top: -54px;
      left: -20px;
      width: 40px;
      height: 40px;
      background: radial-gradient(circle, #ffffff 10%, #f0c000 80%);
      border-radius: 50%;
      border: 3px solid #1e2e3a;
      box-shadow: 0 0 25px #ffd700;
    }

    .wheel-center-dot {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 14%;
      height: 14%;
      background: radial-gradient(circle, #fff9e0 10%, #d4af37 80%);
      border-radius: 50%;
      border: 4px solid #102b38;
      box-shadow: 0 0 25px #f1c40f, inset 0 0 15px #c9a227;
      pointer-events: none;
      z-index: 25;
    }

    /* ===== BOTÃO ===== */
    .button-panel {
      display: flex;
      gap: 30px;
      justify-content: center;
      flex-wrap: wrap;
      margin-top: 4px;
    }

    .btn {
      font-family: 'Segoe UI', 'Arial Black', sans-serif;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 4px;
      font-size: clamp(1.2rem, 4vw, 2rem);
      padding: 18px 42px;
      border: none;
      border-radius: 80px;
      cursor: pointer;
      transition: all 0.15s ease;
      box-shadow: 0 12px 0 #0e3f55, 0 15px 25px black, 0 0 20px #3fa9f5;
      background: linear-gradient(180deg, #f9e38b, #d4a017);
      color: #0a1e2b;
      text-shadow: 0 2px 0 rgba(255,255,255,0.6);
      border: 2px solid #fff8d6;
      position: relative;
      transform: translateY(0);
    }

    .btn:active {
      transform: translateY(8px);
      box-shadow: 0 4px 0 #0e3f55, 0 10px 20px black, 0 0 20px #3fa9f5;
    }

    .btn:disabled {
      opacity: 0.6;
      transform: translateY(5px);
      box-shadow: 0 7px 0 #0e3f55, 0 10px 20px black, 0 0 15px #3fa9f5;
      filter: grayscale(0.4);
      cursor: not-allowed;
    }

    /* ===== RESULTADO ===== */
    .result-area {
      margin-top: 10px;
      min-height: 85px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }

    .category-badge {
      font-size: clamp(2rem, 8vw, 4.8rem);
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 6px;
      padding: 8px 40px;
      background: linear-gradient(135deg, #153e4f, #02141e);
      border-radius: 60px;
      border: 5px solid #f1c40f;
      box-shadow: 0 0 40px #f1c40f, inset 0 0 30px #1b6b8f;
      color: #ffffff;
      text-shadow: 0 0 15px #ffd966, 0 0 35px #ffaa00, 0 8px 10px black;
      display: inline-block;
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.2s;
      animation: popIn 0.5s ease-out;
      max-width: 95vw;
      line-height: 1.2;
      word-break: break-word;
    }

    .category-badge.ready {
      background: linear-gradient(135deg, #1b6b8f, #0a2a3a);
      border-color: #79c1e0;
      box-shadow: 0 0 40px #3fa9f5, inset 0 0 30px #0d3a4f;
      color: #e0f4ff;
      text-shadow: 0 0 15px #79c1e0, 0 0 35px #3fa9f5, 0 8px 10px black;
    }

    @keyframes popIn {
      0% { transform: scale(0.2) rotate(-10deg); opacity: 0; }
      60% { transform: scale(1.1) rotate(2deg); opacity: 1; }
      100% { transform: scale(1) rotate(0); opacity: 1; }
    }

    .confetti-emoji {
      font-size: 2.2rem;
      letter-spacing: 10px;
      margin-top: -5px;
      filter: drop-shadow(0 0 12px gold);
      animation: sparkle 0.8s infinite alternate;
      min-height: 40px;
    }

    @keyframes sparkle {
      0% { opacity: 0.7; transform: scale(0.9); }
      100% { opacity: 1; transform: scale(1.1); text-shadow: 0 0 20px #ffd966; }
    }

    @media (max-width: 600px) {
      .pointer { border-left-width: 20px; border-right-width: 20px; border-top-width: 32px; }
      .pointer::after { top: -46px; left: -18px; width: 36px; height: 36px; }
      .btn { padding: 14px 24px; letter-spacing: 2px; }
      .category-badge { letter-spacing: 2px; padding: 8px 18px; }
    }
  </style>

  <meta name="theme-color" content="#031016">
  <meta name="description" content="MICRO SHOW — O Desafio da Microbiologia. Roleta interativa de categorias.">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">

</head>
<body>
  <div class="stage-glow"></div>

  <div class="main-container">
    <div class="header">
      <h1>MICRO SHOW</h1>
      <div class="sub">O DESAFIO DA MICROBIOLOGIA</div>
    </div>

    <div class="wheel-wrapper">
      <canvas id="wheelCanvas" width="1000" height="1000"></canvas>
      <div class="pointer"></div>
      <div class="wheel-center-dot"></div>
    </div>

    <div class="button-panel">
      <button class="btn" id="spinBtn">GIRAR A ROLETA</button>
    </div>

    <div class="result-area" id="resultArea">
      <div class="category-badge ready" id="categoryDisplay">PREPARADO?</div>
      <div class="confetti-emoji" id="confettiEmoji"></div>
    </div>
  </div>

  <script>
    (function() {
      // ================= CONFIGURAÇÃO =================
      const CATEGORIES = [
        "MICROBIOLOGIA",
        "BACTÉRIAS",
        "GRAM",
        "INFECÇÕES",
        "DIAGNÓSTICO",
        "PREVENÇÃO"
      ];

      // Cores vibrantes das fatias
      const SEGMENT_COLORS = [
        "#6A0DAD", // MICROBIOLOGIA - roxo
        "#E63946", // BACTÉRIAS - vermelho
        "#FFB703", // GRAM - amarelo
        "#2A9D8F", // INFECÇÕES - verde-água
        "#00B4D8", // DIAGNÓSTICO - ciano
        "#F72585"  // PREVENÇÃO - magenta
      ];

      // ✅ Todos os textos em BRANCO (único)
      const TEXT_COLOR = "#FFFFFF";

      const RESET_DELAY_MS = 30000; // 30 segundos

      // ================= ELEMENTOS =================
      const canvas = document.getElementById('wheelCanvas');
      const ctx = canvas.getContext('2d');
      const spinBtn = document.getElementById('spinBtn');
      const categoryDisplay = document.getElementById('categoryDisplay');
      const confettiEmoji = document.getElementById('confettiEmoji');

      const W = 1000, H = 1000;
      const centerX = W / 2;
      const centerY = H / 2;
      const radius = 440;
      const textRadius = 320;

      let rotationAngle = 0;
      let isSpinning = false;
      let spinVelocity = 0;
      let spinRequest = null;
      let resetTimeout = null;

      // ================= DESENHO =================
      function drawWheel(angle = 0) {
        ctx.clearRect(0, 0, W, H);
        const segmentAngle = (Math.PI * 2) / CATEGORIES.length;

        for (let i = 0; i < CATEGORIES.length; i++) {
          const start = i * segmentAngle + angle;
          const end = start + segmentAngle;

          ctx.beginPath();
          ctx.moveTo(centerX, centerY);
          ctx.arc(centerX, centerY, radius, start, end);
          ctx.closePath();

          const grad = ctx.createRadialGradient(centerX, centerY, 100, centerX, centerY, radius);
          grad.addColorStop(0, SEGMENT_COLORS[i]);
          grad.addColorStop(1, shadeColor(SEGMENT_COLORS[i], -25));
          ctx.fillStyle = grad;
          ctx.fill();

          ctx.strokeStyle = "#D4AF37";
          ctx.lineWidth = 3;
          ctx.beginPath();
          ctx.moveTo(centerX, centerY);
          ctx.arc(centerX, centerY, radius, start, end);
          ctx.lineTo(centerX, centerY);
          ctx.stroke();

          // texto (sempre branco)
          const midAngle = start + segmentAngle / 2;
          const textX = centerX + Math.cos(midAngle) * textRadius;
          const textY = centerY + Math.sin(midAngle) * textRadius;

          ctx.save();
          ctx.translate(textX, textY);
          ctx.rotate(midAngle);

          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          // contorno escuro para dar legibilidade sobre qualquer cor
          ctx.shadowColor = 'rgba(0,0,0,0.9)';
          ctx.shadowBlur = 12;
          ctx.shadowOffsetX = 2;
          ctx.shadowOffsetY = 2;

          ctx.fillStyle = TEXT_COLOR;

          if (CATEGORIES[i] === 'MICROBIOLOGIA') ctx.font = 'bold 26px "Segoe UI", "Arial Black", sans-serif';
          else if (CATEGORIES[i] === 'DIAGNÓSTICO') ctx.font = 'bold 30px "Segoe UI", "Arial Black", sans-serif';
          else if (CATEGORIES[i].length > 10) ctx.font = 'bold 28px "Segoe UI", "Arial Black", sans-serif';
          else ctx.font = 'bold 34px "Segoe UI", "Arial Black", sans-serif';

          ctx.fillText(CATEGORIES[i], 0, 0);
          ctx.restore();
        }

        // aro interno
        ctx.beginPath();
        ctx.arc(centerX, centerY, radius - 8, 0, Math.PI * 2);
        ctx.strokeStyle = "#C9A227";
        ctx.lineWidth = 12;
        ctx.stroke();

        ctx.shadowBlur = 0;
        ctx.shadowOffsetX = 0;
        ctx.shadowOffsetY = 0;
      }

      function shadeColor(color, percent) {
        let R = parseInt(color.substring(1,3), 16);
        let G = parseInt(color.substring(3,5), 16);
        let B = parseInt(color.substring(5,7), 16);
        R = Math.round(R * (100 + percent) / 100);
        G = Math.round(G * (100 + percent) / 100);
        B = Math.round(B * (100 + percent) / 100);
        R = Math.min(255, Math.max(0, R));
        G = Math.min(255, Math.max(0, G));
        B = Math.min(255, Math.max(0, B));
        return `#${((1 << 24) + (R << 16) + (G << 8) + B).toString(16).slice(1)}`;
      }

      // ================= RESET =================
      function resetToReady() {
        if (isSpinning) return;
        categoryDisplay.textContent = 'PREPARADO?';
        categoryDisplay.classList.add('ready');
        categoryDisplay.style.opacity = 1;
        confettiEmoji.textContent = '';

        categoryDisplay.style.animation = 'none';
        void categoryDisplay.offsetWidth;
        categoryDisplay.style.animation = 'popIn 0.5s ease-out';
      }

      function scheduleReset() {
        if (resetTimeout) clearTimeout(resetTimeout);
        resetTimeout = setTimeout(() => {
          resetToReady();
          resetTimeout = null;
        }, RESET_DELAY_MS);
      }

      // ================= GIRO =================
      function startSpin() {
        if (isSpinning) return;

        if (resetTimeout) {
          clearTimeout(resetTimeout);
          resetTimeout = null;
        }

        spinBtn.disabled = true;
        isSpinning = true;

        categoryDisplay.classList.remove('ready');
        categoryDisplay.textContent = '... SORTEANDO ...';
        categoryDisplay.style.opacity = 0.7;
        confettiEmoji.textContent = '';

        spinVelocity = (Math.random() * 0.8 + 1.2) * 0.6;

        let lastTimestamp = null;

        function animateSpin(timestamp) {
          if (!lastTimestamp) lastTimestamp = timestamp;
          const delta = Math.min(16, timestamp - lastTimestamp) / 16;
          lastTimestamp = timestamp;

          spinVelocity *= Math.pow(0.975, delta);
          rotationAngle += spinVelocity * delta * 0.9;
          rotationAngle %= (Math.PI * 2);

          drawWheel(rotationAngle);

          if (Math.abs(spinVelocity) < 0.002) {
            spinVelocity = 0;
            isSpinning = false;
            spinBtn.disabled = false;

            const pointerAngle = -Math.PI / 2;
            let effectiveAngle = (pointerAngle - rotationAngle) % (Math.PI * 2);
            if (effectiveAngle < 0) effectiveAngle += Math.PI * 2;

            const segmentAngle = (Math.PI * 2) / CATEGORIES.length;
            let index = Math.floor(effectiveAngle / segmentAngle);
            index = index % CATEGORIES.length;

            const selectedCategory = CATEGORIES[index];

            categoryDisplay.textContent = selectedCategory;
            categoryDisplay.style.opacity = 1;

            const emojis = ['🎉', '✨', '🏆', '🥇', '🔬', '🧪', '⭐', '🎊'];
            const randomEmojis = [];
            for (let i = 0; i < 4; i++) {
              randomEmojis.push(emojis[Math.floor(Math.random() * emojis.length)]);
            }
            confettiEmoji.textContent = randomEmojis.join(' ');

            categoryDisplay.style.animation = 'none';
            void categoryDisplay.offsetWidth;
            categoryDisplay.style.animation = 'popIn 0.5s ease-out';

            scheduleReset();

            if (spinRequest) {
              cancelAnimationFrame(spinRequest);
              spinRequest = null;
            }
            return;
          }

          spinRequest = requestAnimationFrame(animateSpin);
        }

        if (spinRequest) cancelAnimationFrame(spinRequest);
        spinRequest = requestAnimationFrame(animateSpin);
      }

      // ================= INIT =================
      function init() {
        drawWheel(rotationAngle);
        categoryDisplay.textContent = 'PREPARADO?';
        categoryDisplay.classList.add('ready');
        categoryDisplay.style.opacity = 1;
        confettiEmoji.textContent = '';
        spinBtn.addEventListener('click', startSpin);
      }

      init();
    })();
  </script>

  <script>
    // Registra o suporte offline quando o site estiver hospedado em HTTPS.
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js").catch((error) => {
          console.error("Não foi possível ativar o modo offline:", error);
        });
      });
    }
  </script>

</body>
</html>
